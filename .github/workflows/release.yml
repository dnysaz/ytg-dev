name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal (x64 + arm64)
            os: macos-14
            target: universal-apple-darwin
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xz-utils

      - name: Install npm dependencies
        run: npm ci

      # Downloads yt-dlp + ffmpeg + ffprobe and names them per Tauri's
      # externalBin convention (src-tauri/binaries/<name>-<target>).
      - name: Fetch bundled tools
        run: node scripts/fetch-deps.mjs --target ${{ matrix.target }}

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Flatten the output so every matrix entry uploads an identical layout and
      # the release step can glob a single directory.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installers
          find src-tauri/target -type f \
            -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp -v {} installers/ \;
          test -n "$(ls -A installers)" || { echo "no installers produced"; exit 1; }
          ls -la installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: installers/*

  release:
    name: Publish release
    needs: build
    # Publish whatever built successfully instead of losing the whole release
    # because a single architecture failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
